function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {

// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {

  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const S = RNG('tp', key), P = [[-w / 2, -h / 2 + S.n(2)], [w / 2, -h / 2 + S.n(2)], [w / 2 + S.n(3), h / 2], [-w / 2 + S.n(3), h / 2]];
  gfill(P, SK.tape, { a: 0.8, off: [0, 0], key, amp: 1.5 });
  ctx.restore();
}
function scrap(x, y, rot, s, key = 'scrap') {                    // a torn page in flight
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const P = [[-34, -26], [30, -28], [36, 22], [4, 26], [-6, 21], [-32, 27]], S = RNG('scr', key);
  gfill(P, SK.sheet, { off: [0, 0], key, amp: 1.2 });
  gline(closeP(P), { w: 3, key: key + 'o', amp: 1, second: false });
  for (let i = 0; i < 3; i++) gpencil([[-24, -12 + i * 12], [2 + S.f() * 26, -12 + i * 12]], { key: key + 'l' + i, w: 2, amp: 0.8, passes: 1 });
  ctx.restore();
}
function pencilTool(tx, ty, ang, s = 1) {                         // tip at (tx, ty), body up and to the right
  ctx.save(); ctx.translate(tx, ty); ctx.rotate(ang); ctx.scale(s, s);
  gfill([[0, 0], [38, -13], [38, 13]], SK.wood, { off: [0, 0], key: 'pt1', amp: 0.6 });
  gfill([[0, 0], [12, -4], [12, 4]], SK.lead, { off: [0, 0], key: 'pt2', amp: 0.3 });
  const body = [[38, -13], [250, -13], [250, 13], [38, 13]];
  gfill(body, SK.yellow, { off: [3, 2], key: 'pt3', amp: 0.8 });
  ctx.save(); gclip(body); ghatch(38, -13, 250, 13, { ang: 0.02, gap: 8.5, col: '#c9931a', w: 2, a: 0.5, key: 'pt4' }); ctx.restore();
  gfill([[250, -14], [278, -14], [278, 14], [250, 14]], '#b9b3a8', { off: [0, 0], key: 'pt5', amp: 0.6 });
  gfill([[278, -13], [300, -12], [302, 12], [278, 13]], SK.pink, { off: [0, 0], key: 'pt6', amp: 0.6 });
  gline([[0, 0], [38, -13], [300, -13], [302, 12], [38, 13], [0, 0]], { w: 3.2, key: 'pt7', amp: 0.8, second: false });
  gline([[38, -13], [38, 13]], { w: 2, key: 'pt8', amp: 0.6, second: false }); gline([[250, -14], [250, 14]], { w: 2, key: 'pt9', amp: 0.6, second: false });
  ctx.restore();
}
function eraserTool(x, y, ang, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  gfill(sketchBox(-80, -42, 160, 84, 18, 0), SK.pink, { off: [4, 3], key: 'er1' });
  gfill([[-5, -46], [86, -46], [86, 46], [-5, 46]], '#f4efe4', { off: [2, 2], key: 'er2', amp: 1 });
  gfill([[20, -46], [42, -46], [42, 46], [20, 46]], '#5a7fb8', { a: 0.9, off: [0, 0], key: 'er3', amp: 1 });
  gline(sketchBox(-80, -42, 160, 84, 18), { w: 4, key: 'er4' });
  gline([[-5, -46], [86, -46], [86, 46], [-5, 46], [-5, -46]], { w: 3.5, key: 'er5', second: false });
  ctx.restore();
}
function paperPlane(x, y, ang, s = 1, key = 'plane') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  const top = [[48, 0], [-40, -30], [-26, 0]], bot = [[48, 0], [-26, 0], [-40, 24]];
  gfill(top, SK.sheet, { off: [0, 0], key: key + 't', amp: 0.8 }); gfill(bot, '#e9dcc3', { off: [0, 0], key: key + 'b', amp: 0.8 });
  gline(closeP(top), { w: 3.5, key: key + 'o1', amp: 0.8 }); gline(closeP(bot), { w: 3.5, key: key + 'o2', amp: 0.8 });
  ctx.restore();
}
function noteCard(x, y, rot, s, lines = 1, key = 'note', col = SK.terra) {   // an index card; `lines` 0..1 writes its three lines on
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  gfill(sketchBox(-62, -44, 124, 88, 8, 0), '#fffaf0', { off: [4, 4], key });
  gfill([[-62, -44], [-50, -44], [-50, 44], [-62, 44]], col, { a: 0.95, off: [0, 0], key: key + 'm', amp: 0.8 });
  gline(sketchBox(-62, -44, 124, 88, 8), { w: 4, key: key + 'o' });
  for (let i = 0; i < 3; i++) gline([[-36, -20 + i * 20], [-36 + [80, 68, 44][i], -20 + i * 20]], { w: 3, key: key + 'l' + i, amp: 0.6, second: false, part: clamp(lines * 3 - i) });
  ctx.restore();
}
function inkStamp(str, x, y, s, rot, a = 1, key = 'stamp') {     // a red rubber stamp, worn: specks knocked out
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.globalAlpha *= a;
  const w = Math.max(300, letterW(str, 96, 'marker') + 80);
  gline(sketchBox(-w / 2, -62, w, 124, 16), { w: 8, col: SK.red, key: key + '1', second: false });
  gline(sketchBox(-w / 2 + 14, -50, w - 28, 100, 12), { w: 3, col: SK.red, key: key + '2', second: false });
  handLetter(str, 0, 34, 96, { face: 'marker', col: SK.red, key: key + 't', jit: 0.6 });
  ctx.fillStyle = SK.paper; const S = RNG('stk', key);
  for (let i = 0; i < 260; i++) { ctx.globalAlpha = 0.55 * a; ctx.fillRect(-w / 2 + S.f() * w, -62 + S.f() * 124, 2 + S.f() * 4, 2 + S.f() * 3); }
  ctx.restore();
}
function checkMark(x, y, s, part, col = SK.green, key = 'chk') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  gline([[-30, 2], [-8, 26], [38, -30]], { w: 12, col, key, amp: 1.2, part, step: 8 });
  ctx.restore();
}
function sparkle(x, y, r, k, key = 'spk', col = SK.ink) {        // four ink ticks that open and close over k 0..1
  if (k <= 0 || k >= 1) return; const rr = r * Math.sin(Math.PI * clamp(k));
  for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + 0.3; gline([[x + Math.cos(a) * rr * 0.25, y + Math.sin(a) * rr * 0.25], [x + Math.cos(a) * rr, y + Math.sin(a) * rr]], { w: 3.5, col, key: key + i, second: false, amp: 0.5, step: 6 }); }
}
function arrowPencil(P, part, o = {}) {                           // a graphite arrow, written on, the head flicks in last
  const { col = SK.graph, w = 3, key = 'arw' } = o;
  gpencil(P, { part, col, w, key, a: 0.95, passes: 2 });
  if (part > 0.85) {
    const Q = resample(P, false, 6), e = Q[Q.length - 1], q = Q[Math.max(0, Q.length - 4)], an = Math.atan2(e[1] - q[1], e[0] - q[0]), hk = seg(part, 0.85, 1);
    for (const s of [-1, 1]) gpencil([e, [e[0] - Math.cos(an + s * 0.5) * 26 * hk, e[1] - Math.sin(an + s * 0.5) * 26 * hk]], { col, w, key: key + s, amp: 0.6, passes: 1 });
  }
}
function sweat(x, y, k, key = 'sw') {                             // a pencil drop that slides off and fades
  if (k <= 0 || k >= 1) return;
  const yy = y + k * 40; ctx.save(); ctx.globalAlpha *= 1 - k;
  gpencil([[x, yy - 16], [x + 8, yy], [x, yy + 7], [x - 8, yy], [x, yy - 16]], { key, w: 2.5, amp: 0.6, step: 5 });
  ctx.restore();
}
function doodleStar(x, y, r, key = 'star', o = {}) {             // a five-point margin star drawn in one stroke
  const P = []; for (let i = 0; i <= 5; i++) { const a = -Math.PI / 2 + i * TAU * 2 / 5; P.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); }
  return gpencil(P, { key, w: o.w ?? 2.6, a: o.a ?? 0.8, amp: 1.2, step: 8, part: o.part ?? 1, col: o.col ?? SK.graph });
}
function doodleBird(x, y, s, flap, key = 'bird') {               // a two-arc "v" bird; flap 0..1
  const k = 0.35 + 0.65 * flap;
  gline([[x - 26 * s, y - 14 * s * k], [x - 12 * s, y - 16 * s * k], [x, y]], { w: 3 * s, key: key + 'l', amp: 0.5, second: false, step: 6 });
  gline([[x, y], [x + 12 * s, y - 16 * s * k], [x + 26 * s, y - 14 * s * k]], { w: 3 * s, key: key + 'r', amp: 0.5, second: false, step: 6 });
}

// ---------------------------------------------------------------------
//  THE HERO: a terracotta dot with a cream asterisk, eyes, a mouth; arms and legs when it needs to act.
//  o: key, mood ('calm' | 'wow' | 'happy' | 'puzzled'), look [dx, dy] (-1..1), sx, sy (squash), rot,
//     legs (bool), step (-1..1 stride), arms [leftAngle, rightAngle] (radians up from horizontal; null = none)
//  Sets SPARK_AT (the hero's screen spot) for tools/review.
// ---------------------------------------------------------------------
function doodleHero(x, y, r, o = {}) {
  const key = o.key ?? 'hero', mood = o.mood ?? 'calm', lw = Math.max(3, r * 0.065);
  SPARK_AT = toScreen(x, y);
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot ?? 0);
  if (o.legs) {
    const st = o.step ?? 0;
    for (const s of [-1, 1]) {
      const hip = [s * r * 0.32, r * 0.85], kick = s * st * r * 0.22, foot = [s * r * 0.36 + kick, r * 1.42 - Math.max(0, s * st) * r * 0.1];
      gline([hip, foot], { w: lw, key: key + 'leg' + s, amp: 0.8, second: false, step: 8 });
      gline([foot, [foot[0] + s * r * 0.22, foot[1] + 2]], { w: lw * 1.25, key: key + 'ft' + s, amp: 0.5, second: false, step: 6 });
    }
  }
  if (o.arms) [-1, 1].forEach((s, i) => {
    const ang = o.arms[i]; if (ang == null) return;
    const sh = [s * r * 0.9, r * 0.15], L = r * 0.85;
    const el = [sh[0] + s * L * 0.5 * Math.cos(ang * 0.6), sh[1] - L * 0.5 * Math.sin(ang * 0.6)], hd = [sh[0] + s * L * Math.cos(ang), sh[1] - L * Math.sin(ang)];
    gline([sh, el, hd], { w: lw, key: key + 'arm' + s, amp: 0.8, second: false, step: 8 });
    gline(loopPts(hd[0], hd[1], r * 0.09, r * 0.09, 0.1), { w: lw * 0.8, key: key + 'hd' + s, amp: 0.4, second: false, step: 5 });
  });
  ctx.scale(o.sx ?? 1, o.sy ?? 1);
  const body = loopPts(0, 0, r, r, 0, 0, 40);
  gfill(body, SK.terra, { off: [r * 0.06, r * 0.05], key: key + 'f' });
  litHatch(body, { ang: -0.85, gap: Math.max(5, r * 0.08), col: SK.terraD, w: Math.max(1.6, r * 0.03), a: 0.85, key: key + 'h' });
  gline(loopPts(0, 0, r, r, 0.08), { w: lw, key: key + 'o' });
  for (let i = 0; i < 8; i++) {                                                // the cream asterisk on its crown
    const an = i / 8 * TAU + 0.2, r0 = r * 0.04, r1 = r * 0.19, cy = -r * 0.5;
    gline([[Math.cos(an) * r0, cy + Math.sin(an) * r0], [Math.cos(an) * r1, cy + Math.sin(an) * r1]], { w: r * 0.065, col: SK.cream, key: key + 'a' + i, amp: 0.4, second: false, step: 6 });
  }
  const [lx, ly] = o.look ?? [0, 0], blink = mood !== 'wow' && (B + hash(key)) % 37 === 0;
  for (const s of [-1, 1]) {
    const ex = s * r * 0.3 + lx * r * 0.07, ey = r * 0.06 + ly * r * 0.07;
    if (blink) gline([[ex - r * 0.09, ey], [ex + r * 0.09, ey]], { w: lw * 0.9, key: key + 'bl' + s, amp: 0.3, second: false, step: 6 });
    else if (mood === 'happy') gline([[ex - r * 0.09, ey + r * 0.03], [ex, ey - r * 0.06], [ex + r * 0.09, ey + r * 0.03]], { w: lw * 0.9, key: key + 'hp' + s, amp: 0.3, second: false, step: 6 });
    else {
      ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.085, r * (mood === 'wow' ? 0.15 : 0.12), 0, 0, TAU); ctx.fill();
      ctx.fillStyle = SK.cream; ctx.beginPath(); ctx.arc(ex - r * 0.025, ey - r * 0.045, r * 0.028, 0, TAU); ctx.fill();
    }
  }
  if (mood === 'puzzled') gline([[r * 0.18, -r * 0.16], [r * 0.42, -r * 0.24]], { w: lw * 0.8, key: key + 'brow', amp: 0.4, second: false, step: 6 });
  const my = r * 0.4;
  if (mood === 'wow') { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(0, my + r * 0.02, r * 0.08, r * 0.1, 0, 0, TAU); ctx.fill(); }
  else if (mood === 'happy') { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.moveTo(-r * 0.2, my - r * 0.05); ctx.quadraticCurveTo(0, my + r * 0.3, r * 0.2, my - r * 0.05); ctx.closePath(); ctx.fill(); }
  else if (mood === 'puzzled') gline([[-r * 0.16, my], [-r * 0.05, my - r * 0.04], [r * 0.06, my + r * 0.03], [r * 0.16, my - r * 0.02]], { w: lw * 0.8, key: key + 'm', amp: 0.4, second: false, step: 5 });
  else gline(arcPts(0, my - r * 0.12, r * 0.16, Math.PI * 0.2, Math.PI * 0.8, 8), { w: lw * 0.8, key: key + 'm', amp: 0.4, second: false, step: 5 });
  ctx.restore();
  return body;
}

// ---------------------------------------------------------------------
//  CAPTIONS: the lettering is the narrator. Drawn after the camera (DEFER), at screen size.
//  pageTag(str)                 a marker label on masking tape, top left, written on at the era's start
//  pageCaption(lines, hi, o)    1–2 hand-lettered lines centred on CX, written on letter by letter;
//                               hi = [[lineIndex, 'word'], ...] gets a highlighter swipe once the line is down
// ---------------------------------------------------------------------
function pageTagDraw(str) {
  const size = 70, w = letterW(str, size, 'marker'), x = 84, y = 340;
  tapeStrip(x + w / 2, y - size * 0.3, w + 70, -0.03, 'tagtape' + str, size * 1.15);
  const [x0, x1] = handLetter(str, x, y, size, { face: 'marker', align: 'left', reveal: ev(E0 + 0.1, 0.3), key: 'tag' + str, jit: 0.7 });
  underline(x0, x1, y + 20, { col: SK.red, w: 5, key: 'tagu' + str, part: ev(E0 + 0.4, 0.2) });
}
function pageCaptionDraw(lines, hi = [], o = {}) {
  const size = o.size ?? 80, y0 = o.y ?? 1330, lh = size * 1.12, t0 = E0 + (o.at ?? 0.35);
  lines.forEach((line, li) => {
    const y = y0 + li * lh, font = skFont(size, 'hand'), xs = glyphX(line, font), x0 = CX - xs[xs.length - 1] / 2;
    for (const [hl, word] of hi) if (hl === li) { const k = line.indexOf(word); if (k >= 0) highlight(x0 + xs[k], x0 + xs[k + word.length], y - size * 0.28, size * 0.55, ev(t0 + 0.5 + li * 0.25, 0.25), { key: 'caph' + li + line }); }
    handLetter(line, CX, y, size, { reveal: ev(t0 + li * 0.25, 0.4), key: 'cap' + li + line });
  });
}
const pageTag = (str) => { const f = () => pageTagDraw(str); if (DEFER) DEFER.push(f); else f(); };
const pageCaption = (lines, hi, o) => { const f = () => pageCaptionDraw(lines, hi, o); if (DEFER) DEFER.push(f); else f(); };

// =====================================================================
//  STYLE — the renderer's hooks (kit/morph.js). A morph happens on the bare page.
// =====================================================================
const STYLE = {
  name: 'sketchbook',
  paper: SK.paper,
  backdrop(c) {   // the page, washed toward colour c (c = the paper itself at the heart of a morph)
    fillAll(c);
    ctx.save(); screen(); ctx.drawImage(pageTex('dots'), -SK_M, -SK_M); ctx.restore();
  },
  window(P, key, src) {   // the world seen through a graphite outline, lifted off the page by a soft smudge shadow
    ctx.save();
    ctx.shadowColor = 'rgba(70,64,58,0.42)'; ctx.shadowBlur = 26; ctx.shadowOffsetX = 10; ctx.shadowOffsetY = 14;
    trace(P, true); ctx.fillStyle = SK.paper; ctx.fill();
    ctx.restore();
    ctx.save(); trace(P, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    gpencil(P, { closed: true, w: 3, a: 0.6, amp: 3.2, key: key + 'c', step: 14 });
    gline(P, { closed: true, w: 5.5, key: key + 'rim', step: 14 });
  },
  blob(P, c, key) {   // the shape mid-morph: a colour scribble inside a graphite outline
    gfill(P, c, { a: 0.3, off: [6, 5], key: key + 'f' });
    scribbleFill(P, c, { key: key + 's', gap: 12, w: 4, base: 0.25 });
    gpencil(P, { closed: true, w: 2.6, a: 0.7, amp: 3, key: key + 'c' });
    gline(P, { closed: true, w: 5.5, key: key + 'o' });
  },
  hero(x, y, r, o) { doodleHero(x, y, r * 0.6, { ...o, key: o.key }); },
  heroColor: SK.terra,
  heroPts: (x, y, r) => ellipsePts(x, y, r * 0.6, r * 0.6, 0, 96),
  post() { grain({ n: 1800, dark: 'rgba(60,56,52,0.12)', light: 'rgba(255,253,245,0.16)' }); },
};

// =====================================================================
//  SCENES — sk-1-folds. World coords 1080x1920 (the page); TT on 2s.
//  One page, two eras. Things are DRAWN, not popped: pencil -> ink;
//  the secret nose fold gets the one highlighter swipe; terracotta is
//  the hero only. Fold geometry: the sheet 230-850 x 390-1170.
// =====================================================================
const SX0 = 230, SX1 = 850, SY0 = 390, SY1 = 1170, SMX = 540;
const SHEET_P = [[SX0, SY0], [SX1, SY0], [SX1, SY1], [SX0, SY1]];

// a circled step number in graphite (the instruction page's numbering)
function stepNum(n, x, y, t) {
  const k = popS(t);
  if (k <= 0) return;
  gline(loopPts(x, y, 34 * k, 34 * k, 0.05), { key: 'sn' + n, w: 3, a: 0.8 });
  handLetter(String(n), x, y + 26 * k, 56, { col: SK.graph, key: 'snl' + n });
}

// background life: a tiny ant walking a pencil line (from the demo, keyed to this page)
function ant(x, y, s, key) {
  for (let i = 0; i < 3; i++) { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(x + (i - 1) * 11 * s, y - 6 * s, (i === 1 ? 5 : 6.5) * s, 5 * s, 0, 0, TAU); ctx.fill(); }
  const k = B % 2 ? 1 : -1;
  for (let i = 0; i < 3; i++) gline([[x + (i - 1) * 8 * s, y - 4 * s], [x + (i - 1) * 8 * s + k * (i % 2 ? 5 : -5) * s, y + 3 * s]], { w: 1.8 * s, key: key + i, amp: 0.3, second: false, step: 4 });
  gline([[x + 16 * s, y - 8 * s], [x + 24 * s, y - 16 * s]], { w: 1.6 * s, key: key + 'a', amp: 0.3, second: false, step: 4 });
}
// background life: the margin plane looping a figure-eight (the demo's)
function marginPlane(key) {
  const at = (p) => [830 + 120 * Math.sin(TAU * p), 410 + 55 * Math.sin(2 * TAU * p)];
  const p = TT / 3, trail = [];
  for (let i = 0; i <= 24; i++) trail.push(at(p - 0.35 + 0.35 * i / 24));
  ctx.save(); ctx.setLineDash([10, 12]); gpencil(trail, { key: key + 't', w: 2.2, a: 0.55, passes: 1, amp: 1 }); ctx.restore();
  const [x, y] = at(p), [x2, y2] = at(p + 0.01);
  paperPlane(x, y, Math.atan2(y2 - y, x2 - x), 1.15, key);
}

// the finished dart, top view (the fold cascade's result), drawn at (540, 780)
function dartPts(s = 1, cy = 780) {
  const nose = 420 * s, tail = 1150 * s, wingY = 1030 * s, wingX = 300;
  const s2 = 540 + (540 - wingX);
  return { nose: [SMX, lerp(cy - 350 * s, cy, 0) + (nose - 780)], P: [[SMX, 420], [wingX, wingY], [SX0 + 24, tail], [s2, tail], [SMX + 250, wingY]], spine: [[SMX, 420], [SMX, tail]], wings: [[[SMX, 470], [wingX, wingY]], [[SMX, 470], [s2, wingY]]] };
}

// =====================================================================
//  ERA 1 — THE MAKING: the five folds, pencil -> ink, the secret highlighted
// =====================================================================
function sMaking() {
  const cu = TIMELINE.cues;
  sketchPage({ grid: 'dots' });
  // the ground line the hero stands on; an ant; margin stars; the margin plane
  gpencil([[110, 1470], [420, 1464], [700, 1472], [960, 1466]], { key: 'ground', w: 3, a: 0.7 });
  ant(560 + 110 * TT, 1469, 1.4, 'ant');
  [[110, 560, 0], [168, 760, 1], [96, 930, 2]].forEach(([x, y, i]) => doodleStar(x, y, 22 + 7 * ((B + i) % 3 === 0), 'mstar' + i, { w: 3.2 }));

  // ---- THE SHEET: pencil construction, then ink (drawn, not popped)
  gpencil(SHEET_P, { key: 'sheetp', w: 2.6, a: 0.6, part: ev(cu.sheet, 0.7) });
  gfill(SHEET_P, SK.card, { key: 'sheetf', a: 0.85, off: [2, 3] });
  gline(SHEET_P, { key: 'sheet', w: 5, closed: true, part: ev(cu.sheet + 0.5, 0.6) });
  const sheetTip = writeEnd(SHEET_P, ev(cu.sheet, 0.7));
  if (TT < cu.half) pencilTool(sheetTip[0], sheetTip[1], -0.75 + 0.08 * Math.sin(B * 1.7), 1);

  // ---- FOLD 1: in half, open back up — the dashed centre crease
  stepNum(1, 150, 470, cu.five);
  ctx.save(); ctx.setLineDash([16, 14]);
  gpencil([[SMX, SY0 + 8], [SMX, SY1 - 8]], { key: 'crease1', w: 3.4, a: 0.85, part: ev(cu.half, 0.45) });
  ctx.restore();
  // the fold gesture: a curved arrow showing the halves closing then opening
  arrowPencil([[420, 520], [500, 560], [532, 640]], ev(cu.half + 0.3, 0.4));
  arrowPencil([[SMX, 660], [SMX, 660]], 0);   // (no-op placeholder keeps numbering honest)

  // ---- FOLD 2: both corners to the middle line — diagonal creases, flaps hatched
  stepNum(2, 150, 700, cu.corners - 0.1);
  const c2 = ev(cu.corners, 0.5);
  for (const sgn of [-1, 1]) {
    const cxp = sgn < 0 ? SX0 : SX1;
    gpencil([[cxp, SY0], [SMX, 760]], { key: 'd2' + sgn, w: 2.6, a: 0.75, part: c2 });
  }
  // the folded flaps: paper-filled triangles with hatch, inked edges (settling)
  if (c2 > 0.5) {
    const f2 = clamp((c2 - 0.5) * 2);
    for (const sgn of [-1, 1]) {
      const cxp = sgn < 0 ? SX0 : SX1;
      const flap = [[cxp, SY0], [SMX, 760], [cxp, 640]];
      gfill(flap, SK.card, { key: 'flap2' + sgn, a: 0.9 * f2, off: [1, 2] });
      ctx.save(); gclip(flap);
      ghatch(Math.min(cxp, SMX) - 40, 380, Math.max(cxp, SMX) + 40, 800, { ang: sgn * 0.7, gap: 11, col: SK.graph, w: 2, a: 0.4 * f2, key: 'fh2' + sgn });
      ctx.restore();
      gline([[cxp, SY0], [SMX, 760]], { key: 'fi2' + sgn, w: 4, part: clamp(c2 * 2 - 1) });
    }
  }

  // ---- FOLD 3: the edges back to the middle — steeper creases, the point sharpens
  stepNum(3, 150, 930, cu.edges - 0.1);
  const c3 = ev(cu.edges, 0.5);
  for (const sgn of [-1, 1]) {
    const cxp = sgn < 0 ? SX0 : SX1;
    gpencil([[cxp, 640], [SMX, 560]], { key: 'd3' + sgn, w: 2.6, a: 0.75, part: c3 });
    if (c3 > 0.6) gline([[cxp, 640], [SMX, 560]], { key: 'fi3' + sgn, w: 4, part: clamp(c3 * 2 - 1.2) });
  }
  // the pencil prop follows the working crease through folds 2-3
  if (TT >= cu.corners && TT < cu.edges + 0.4) {
    const w = writeEnd([[SX0, SY0], [SMX, 760], [SX1, SY0]], clamp((TT - cu.corners) / (cu.edges + 0.2 - cu.corners)));
    pencilTool(w[0], w[1], -0.6 + 0.1 * Math.sin(B * 1.9), 1);
  }

  // ---- FOLDS 4 + 5: in half, wings down — the finished dart silhouette
  stepNum(4, 826, 470, cu.wings - 0.1);
  stepNum(5, 826, 700, cu.wings + 0.3);
  const c4 = ev(cu.wings, 0.7);
  if (c4 > 0) {
    const D = dartPts();
    // the halves close: the centre line inks solid; the outer sheet dims to graphite
    gline(D.spine, { key: 'spine', w: 4.5, part: clamp(c4 * 1.4) });
    // the wings: their creases from the nose out, then the final outline
    for (const sgn of [0, 1]) gline(D.wings[sgn], { key: 'wing' + sgn, w: 4, part: clamp(c4 * 2 - 0.7 - sgn * 0.3) });
    gline(D.P, { key: 'dart', w: 5, closed: true, part: clamp(c4 * 2 - 1.1) });
    gfill(D.P, SK.card, { key: 'dartf', a: 0.9 * clamp(c4 * 2 - 1.3), off: [2, 3] });
    if (TT >= cu.wings && TT < cu.secret) {
      const w = writeEnd([...D.wings[0], ...D.wings[1].reverse()], clamp(c4 * 1.6));
      pencilTool(w[0], w[1], -0.5 + 0.1 * Math.sin(B * 2.1), 1);
    }
  }

  // ---- THE SECRET: one tiny fold at the nose — THE highlighter swipe
  stepNum(6, 826, 930, cu.secret);
  const ns = ev(cu.nose, 0.5);
  if (ns > 0) {
    // the nose band: two lines across the tip, the tip flap folds down
    gline([[SMX - 88, 480], [SMX + 88, 480]], { key: 'noseA', w: 4, part: ns });
    gline([[SMX - 74, 545], [SMX + 74, 545]], { key: 'noseB', w: 4, part: clamp(ns * 2 - 1) });
    // the folded tip: hatched (weight!) and inked
    const tipP = [[SMX - 74, 480], [SMX + 74, 480], [SMX + 62, 545], [SMX - 62, 545]];
    ctx.save(); gclip(tipP);
    ghatch(SMX - 80, 470, SMX + 80, 560, { ang: 0.4, gap: 8, col: SK.graph, w: 2.4, a: 0.75 * clamp(ns * 2 - 1), key: 'noseh' });
    ctx.restore();
    gline(tipP, { key: 'noseT', w: 4, closed: true, part: clamp(ns * 2 - 1) });
    // THE highlight: the one glowing thing on the page — over the nose band
    const hp = clamp((ns - 0.6) * 2.2);
    if (hp > 0) highlight(SMX - 96, SMX + 96, 470, 110, hp, { key: 'noseHi' });
    arrowPencil([[SMX + 120, 430], [SMX + 150, 500], [SMX + 130, 560]], clamp(ns * 2 - 1.2));
    if (TT >= cu.nose && TT < cu.weight) sparkle(SMX + 96, 430, 30 + 6 * (B % 2), 'nosesp');
  }

  // ---- THE PHYSICS: weight forward of the lift — a small side-view diagram
  const ph = ev(cu.weight, 0.5);
  if (ph > 0) {
    const dx = 180, dy = 1230;
    // the dart in profile, on a fulcrum at the quarter point
    const prof = [[dx - 130, dy], [dx + 120, dy - 10], [dx + 130, dy - 26], [dx - 130, dy - 12]];
    gfill(prof, SK.card, { key: 'proff', a: 0.9, off: [1, 2] });
    gline(prof, { key: 'prof', w: 4, closed: true, part: clamp(ph * 1.4) });
    gline([[dx - 30, dy], [dx - 30, dy + 40]], { key: 'ful', w: 3.4, part: clamp(ph * 2 - 0.6) });
    gline([[dx - 46, dy + 40], [dx - 14, dy + 40]], { key: 'fulb', w: 3.4, part: clamp(ph * 2 - 0.8) });
    // weight: down at the nose (forward); lift: up behind it
    gline([[dx - 96, dy - 40], [dx - 96, dy - 8]], { key: 'wArr', w: 4, part: clamp(ph * 2 - 0.9) });
    arrowPencil([[dx - 96, dy - 8], [dx - 96, dy - 4]], clamp(ph * 2 - 1.2));
    gline([[dx + 40, dy - 64], [dx + 40, dy - 32]], { key: 'lArr', w: 4, part: clamp(ph * 2 - 1.1) });
    arrowPencil([[dx + 40, dy - 32], [dx + 40, dy - 28]], clamp(ph * 2 - 1.4));
    handLetter('weight', dx - 156, dy - 74, 38, { col: SK.graph, key: 'wl', reveal: clamp(ph * 2 - 1) });
    handLetter('lift', dx + 10, dy - 92, 38, { col: SK.graph, key: 'll', reveal: clamp(ph * 2 - 1.2) });
  }

  // ---- THE DIHEDRAL: wings up, a shallow V — the front view
  const dh = ev(cu.shallow - 0.15, 0.4);
  if (dh > 0) {
    const vx = 700, vy = 1230;
    gline([[vx - 200, vy - 70], [vx, vy + 8], [vx + 200, vy - 70]], { key: 'vee', w: 4.5, part: dh });
    gline([[vx, vy + 8], [vx, vy + 34]], { key: 'veec', w: 3, part: clamp(dh * 2 - 0.8) });
    ctx.save(); ctx.setLineDash([8, 10]);
    gpencil([[vx - 200, vy + 6], [vx + 200, vy + 6]], { key: 'veeflat', w: 2.6, a: 0.6 });
    ctx.restore();
    handLetter('a shallow V', vx - 120, vy - 96, 36, { col: SK.graph, key: 'vl', reveal: clamp(dh * 2 - 1) });
  }

  // ---- the hero: the maker, on the ground line, watching the folds land
  const focus = TT >= cu.half, wow = TT >= cu.nose && TT < cu.wings + 1;
  doodleHero(230, 1380, 96, {
    key: 'hero', legs: true, mood: wow ? 'wow' : focus ? 'calm' : 'puzzled',
    look: [0.9, -0.5], step: 0,
    arms: TT >= cu.secret && TT < cu.nose ? [-1.1, 1.2] : [-0.5, 0.5],
    sy: 1 + 0.04 * Math.sin(TT * 3.2), sx: 1 - 0.03 * Math.sin(TT * 3.2),
  });
  if (!focus) handLetter('?', 320, 1230 + 6 * Math.sin(B * 0.9), 80, { col: SK.graph, key: 'q' });

  // ---- per-beat captions (each holds its window; one highlighted word each)
  if (TT < cu.half) pageCaption(['a sheet of paper', 'wants to fly'], [[1, 'fly']]);
  else if (TT < cu.corners) pageCaption(['fold one: in half,', 'and open it back up'], [[0, 'half']]);
  else if (TT < cu.edges) pageCaption(['corners to', 'the middle line'], [[1, 'middle']]);
  else if (TT < cu.wings) pageCaption(['edges in again,', 'then wings down'], [[1, 'wings']]);
  else if (TT < cu.nose) pageCaption(['now the secret:', 'a tiny fold at the nose'], [[1, 'nose']]);
  else if (TT < cu.shallow) pageCaption(['weight forward,', 'ahead of the lift'], [[0, 'forward']]);
  else pageCaption(['wings up a little,', 'like a shallow V'], [[1, 'shallow']]);
  pageTag('fold it');
}

// =====================================================================
//  ERA 2 — THE FLIGHT: the launch (the cut), the glide, the landing
// =====================================================================
function sFlight() {
  const cu = TIMELINE.cues;
  sketchPage({ grid: 'dots' });
  gpencil([[110, 1470], [420, 1464], [700, 1472], [960, 1466]], { key: 'ground', w: 3, a: 0.7 });
  ant(560 + 110 * TT, 1469, 1.4, 'ant2');
  [[110, 560, 0], [168, 760, 1], [96, 930, 2]].forEach(([x, y, i]) => doodleStar(x, y, 22 + 7 * ((B + i) % 3 === 0), 'mstar2' + i, { w: 3.2 }));
  marginPlane('mp2');

  // the flight path: launch from the hero's hand, up and across, a loop, glide to land
  const flightT = (u) => {
    // a hand-tuned path: rise, cruise, a small loop, descend to the landing
    if (u < 0.35) { const k = u / 0.35; return [lerp(300, 620, k), lerp(1230, 640, EZ.o2(k)) - Math.sin(k * Math.PI) * 60, -0.35 - 0.5 * k]; }
    if (u < 0.62) { const k = (u - 0.35) / 0.27; return [lerp(620, 810, k), 640 + Math.sin(k * Math.PI * 1.2) * 40, -0.85]; }
    if (u < 0.82) { const k = (u - 0.62) / 0.2; const a = k * TAU - 0.4; return [700 + Math.cos(a) * 110, 760 + Math.sin(a) * 90, a + Math.PI / 2]; }   // the loop
    const k = (u - 0.82) / 0.18;
    return [lerp(810, 640, k), lerp(850, 1230, k * k), 0.15 + 0.25 * k];
  };
  const fu = clamp(seg(TT, K1, cu.land), 0, 1);
  // the trail: dashed graphite behind the plane, written on as it flies
  const trail = [];
  for (let i = 0; i <= 46; i++) { const t = Math.min(fu, 1) * i / 46; const [x, y] = flightT(t); trail.push([x, y]); }
  ctx.save(); ctx.setLineDash([10, 13]);
  gpencil(trail, { key: 'ftrail', w: 2.6, a: 0.65, passes: 1, amp: 1.2 });
  ctx.restore();
  // the plane itself (the kit's paperPlane, side view)
  const [px, py, pa] = flightT(fu);
  if (fu < 1) paperPlane(px, py, pa, 2.1, 'plane');
  else {
    // landed: the plane rests on the ground, slightly crumpled, dust puffs, the check
    paperPlane(640, 1218, 0.06, 2.1, 'planeL');
    if (TT >= cu.land) for (let i = 0; i < 3; i++) gline([[640 - 60 - i * 40, 1240], [640 - 76 - i * 44, 1256]], { w: 3, key: 'dust' + i, second: false, a: 0.7 });
    if (TT >= cu.land + 0.2) checkMark(760, 1160, 1.3, clamp(seg(TT, cu.land + 0.2, cu.land + 0.5)));
  }

  // the hero: threw it (the arm swing at the cut), then follows the flight with its eyes
  const threw = seg(TT, K1 - 0.001, K1 + 0.3);
  const armSwing = threw > 0 ? lerp(2.4, -0.4, EZ.o2(clamp(threw))) : 0.4;
  const [lx, ly] = [px, py];
  doodleHero(230, 1380, 96, {
    key: 'hero', legs: true, mood: fu < 1 ? 'wow' : 'happy',
    look: [clamp((lx - 230) / 500, -1, 1), clamp((ly - 1380) / 500, -1, 0.2)], step: 0,
    arms: [-0.5, armSwing],
    sy: 1 + 0.05 * Math.sin(seg(TT, K1, K1 + 0.4) * Math.PI), sx: 1 - 0.04 * Math.sin(seg(TT, K1, K1 + 0.4) * Math.PI),
  });
  if (TT < K1 + 0.6) handLetter('!', 320, 1230 - 30 * Math.sin(seg(TT, K1, K1 + 0.4) * Math.PI), 96, { face: 'marker', col: SK.ink, key: 'bang', reveal: clamp(seg(TT, K1, K1 + 0.12)) });

  // the launch burst: a few speed lines at the hand
  if (TT < K1 + 0.5) for (let i = 0; i < 3; i++) gline([[330 + i * 26, 1160 + i * 22], [392 + i * 30, 1130 + i * 26]], { w: 3.4, key: 'spd' + i, second: false, a: 1 - clamp(seg(TT, K1 + 0.15, K1 + 0.5)) });

  // the ending: "go make one" hand-lettered big, underlined in red (once)
  const gm = ev(cu.make, 0.5);
  if (gm > 0) {
    const [x0, x1] = handLetter('go make one', CX, 560, 96, { face: 'marker', col: SK.ink, key: 'go', reveal: gm });
    underline(x0, x1, 596, { part: clamp((gm - 0.7) * 3) });
  }
  // per-beat captions
  if (TT < cu.glide) pageCaption(['throw it gently,', 'almost level'], [[0, 'gently']], { at: 0.05 });
  else pageCaption(['it should glide.', 'go make one'], [[1, 'glide']], { at: cu.glide - E0 });
  pageTag('fly it');
}

// =====================================================================
//  ERAS + BRIDGES — sk-1-folds. One page. THE LAUNCH is a shape morph:
// the page closes onto the finished dart, the dart becomes the flying
// plane (a colour scribble inside a graphite outline — literally true),
// and the flight page opens around it. The payoff hit lands at the
// morph's centre, in the pause before "Throw it gently".
// =====================================================================
const ERA_BG = ['#f2ead8', '#f2ead8'];

// the dart, top view, at the page centre (the shape it has at the launch)
const DART_A = () => ({ P: [[SMX, 420], [300, 1030], [254, 1150], [826, 1150], [790, 1030]], c: '#fffdf6' });
// the plane, side view, at the launch position (the hero's hand height)
const PLANE_PTS = (x, y, a) => {
  const c = Math.cos(a), s = Math.sin(a), R = (u, v) => [x + u * c - v * s, y + u * s + v * c];
  return [R(-10, -78), R(64, 6), R(18, 6), R(40, 52), R(-56, 6)];
};
const PLANE_B = () => ({ P: PLANE_PTS(300, 1230, -0.2), c: '#fffdf6' });

const BRIDGES = [
  { // THE LAUNCH: the folded dart becomes the flying plane
    tc: K1, d: 0.4,
    A: DART_A, B: PLANE_B,
  },
];

// =====================================================================
//  kit/morph.js — the renderer for pieces built from ERAS (scenes) joined by SHAPE MORPHS.
//
//  At each bridge time tc:
//    shrink [tc-d, tc-m]      the old era is seen through a window shaped like the bridge object (STYLE.window),
//                             shrinking onto the object while the backdrop fades to blank paper
//    morph  [tc-m, tc+m]      on blank paper, the object's outline blends into its counterpart's
//                             (both resampled by angle around their centroids; colour lerped). Hero-to-hero
//                             bridges draw the hero itself with blended position, size and ray count.
//    grow   [tc+m, tc+d]      the new era opens out of a window shaped like the counterpart
//    d = the bridge's half-length (default 0.6s, so a bridge costs 1.2s), m = the morph's half (default 0.2s, or d/3 when d is set).
//    Short pieces: { tc, d: 0.4 } (0.8s) or fewer bridges — see craft.md -> Transitions.
//  Era boundaries WITHOUT a bridge are hard cuts (keep at most one: the slam).
//
//  The piece defines (in its head / src):
//    ERA_LIST = [[t0, t1, () => drawScene()], ...]      scenes draw in world coords, call yearTag()/capStrip()
//    ERA_BG   = ['#hex', ...]                          each era's dominant colour (for the fade to paper)
//    BRIDGES  = [{ tc, A: () => shape, B: () => shape, d?, m? }]   shape = { P: points, c: '#hex' } or SP(x, y, r, rays)
//    function pieceCam(era, t) { return null | CAM }   optional; use push() / bump() below
//  Shapes are in each era's world coords; the bridge object must be in frame at tc (pull push-ins back first).
//  The look comes from the style kit's STYLE hooks (paper, backdrop, window, blob, hero, post, ones):
//  this file draws nothing itself, so the same piece structure works in any style.
// =====================================================================
// ---- cameras: CAM = { z, tx, ty }; camOf({ z, p, to }) puts world point p on screen point to
const CAM0 = { z: 1, tx: 0, ty: 0 };
const camOf = (c) => ({ z: c.z, tx: c.to[0] - c.z * c.p[0], ty: c.to[1] - c.z * c.p[1] });
const camMix = (a, b, u) => ({ z: lerp(a.z, b.z, u), tx: lerp(a.tx, b.tx, u), ty: lerp(a.ty, b.ty, u) });
// an eased push-in over [a, b] to cam, optionally pulled back over [oa, ob]
function push(t, a, b, cam, oa, ob) { let u = EZ.io(seg(t, a, b)); if (oa != null) u *= 1 - EZ.io(seg(t, oa, ob)); return u > 0 ? camMix(CAM0, camOf(cam), u) : null; }
// a zoom bump on every beat from t0, centred on point p (the hero keeps its screen spot)
function bump(t, t0, p, amt = 0.3, every = 0.5) { return camOf({ z: 1 + amt * Math.exp(-mod(t - t0, every) * 7), p, to: p }); }
function camAt(era, t) { return (typeof pieceCam === 'function' && pieceCam(era, t)) || CAM0; }
const camPts = (P, c) => P.map(([x, y]) => [c.z * x + c.tx, c.z * y + c.ty]);
// ---- bridge shapes
function starPts(x, y, r, n, r0 = -Math.PI / 2, m = 96) {
  const P = []; for (let i = 0; i < m; i++) { const a = i / m * TAU, k = 0.42 + 0.58 * (0.5 + 0.5 * Math.cos(n * (a - r0))) ** 3; P.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  return P;
}
const SP = (x, y, r, n) => ({ spark: [x, y, r, n] });
const shapeOf = (s) => (s.spark ? { P: (STYLE.heroPts || starPts)(...s.spark), c: STYLE.heroColor, spark: s.spark } : s);
function byAngle(P, m = 96) {   // resample a closed outline to m points by angle around its centroid
  const c = P.reduce((a, p) => [a[0] + p[0] / P.length, a[1] + p[1] / P.length], [0, 0]), Q = resample(P, true, 4), out = [];
  for (let i = 0; i < m; i++) {
    const a = -Math.PI + i / m * TAU; let best = null, bd = 1e9;
    for (const q of Q) { let d = Math.atan2(q[1] - c[1], q[0] - c[0]) - a; d = Math.abs(Math.atan2(Math.sin(d), Math.cos(d))); const r = Math.hypot(q[0] - c[0], q[1] - c[1]); if (d < bd - 1e-4 || (Math.abs(d - bd) < 1e-4 && r > best[2])) { bd = d; best = [q[0], q[1], r]; } }
    out.push([best[0], best[1]]);
  }
  return { P: out, c };
}
const mixHex = (a, b, u) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], u))).join(',')})`; };
function maskK(P) {   // how far the window must scale about its centroid to cover the frame
  const c = P.reduce((a, p) => [a[0] + p[0] / P.length, a[1] + p[1] / P.length], [0, 0]);
  const rmin = Math.max(8, Math.min(...byAngle(P, 48).P.map((p) => Math.hypot(p[0] - c[0], p[1] - c[1]))));
  const far = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map((q) => Math.hypot(q[0] - c[0], q[1] - c[1])));
  return { c, kmax: far / rmin * 1.1 };
}
const scaled = (P, c, k) => P.map(([x, y]) => [c[0] + (x - c[0]) * k, c[1] + (y - c[1]) * k]);
// ---- layers and windows
const LAYER = [];
function layer(i) { if (!LAYER[i]) { const c = document.createElement('canvas'); c.width = W; c.height = H; LAYER[i] = c; } return LAYER[i]; }
function renderEra(e, target) {   // draws era e into target; returns its overlay queue (year tag, caption)
  const saved = ctx; ctx = target.getContext('2d');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.setLineDash([]);
  ctx.fillStyle = STYLE.paper; ctx.fillRect(0, 0, W, H);   // a clean sheet every frame: nothing carries over between frames
  const cam = camAt(e, TT); ctx.setTransform(cam.z, 0, 0, cam.z, cam.tx, cam.ty);
  DEFER = []; ERA_LIST[e][2](); const q = DEFER; DEFER = null;
  ctx.restore(); ctx = saved;
  return q;
}
function flush(q, e) { const keep = E0; E0 = ERA_LIST[e][0]; ctx.setTransform(1, 0, 0, 1, 0, 0); q.forEach((f) => f()); E0 = keep; }
function shotAtFrame(fr) {
  for (const s of TIMELINE.shots) if (fr >= Math.round(s.t0 * FPS) && fr < Math.round(s.t1 * FPS)) return s;
  return TIMELINE.shots[TIMELINE.shots.length - 1];
}
const eraAt = (t) => ERA_LIST.findIndex(([a, b]) => t >= a - 1e-6 && t < b - 1e-6);
// renderFrame(t, canvas, sub): sub = true draws the exact time t between frames (motion blur sub-frames, styles on 1s)
function renderFrame(t, canvas, sub) {
  const cv = canvas || document.getElementById('c');
  ctx = cv.getContext('2d');
  F = ((Math.floor(sub ? t * FPS + 1e-6 : Math.round(t * FPS)) % NFRAMES) + NFRAMES) % NFRAMES;
  B = Math.floor(F / 2);
  TT = (STYLE.ones ? (sub ? F + (t * FPS - Math.floor(t * FPS + 1e-6)) : F) : B * 2) / FPS;
  // the era is picked by the real frame, so a cut on an odd frame (a 16th at 24fps) lands on that frame;
  // on its first frame the new era is drawn at its own start time (motion stays on 2s inside it)
  const s = shotAtFrame(F), e = Math.max(0, eraAt(F / FPS));
  E0 = ERA_LIST[e][0];
  if (TT < E0 - 1e-6) TT = E0;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.setLineDash([]); ctx.filter = 'none';
  SPARK_AT = null;
  const bd = (r) => r.d ?? 0.6, bm = (r) => r.m ?? (r.d != null ? r.d / 3 : 0.2);
  const tr = BRIDGES.find((r) => TT >= r.tc - bd(r) - 1e-6 && TT < r.tc + bd(r) - 1e-6);
  if (!tr) {
    const q = renderEra(e, layer(0)); ctx.drawImage(layer(0), 0, 0); flush(q, e);
