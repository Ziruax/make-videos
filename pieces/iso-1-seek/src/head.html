<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fifteen Milliseconds</title>
<style>
  html, body { margin: 0; height: 100%; background: #e6e6ea; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  FIFTEEN MILLISECONDS — 9:16, ~33.3s @ 24fps, 120 BPM, isometric line art.
//  A hard drive, drawn as it truly is: a locked-off build — the sealed box
//  drops in, the lid opens on its hinge (the cutaway), the platter spins up,
//  the head floats (a camera push to the nanometer gap), a save triggers a
//  seek, and THE PAYOFF: two true-proportion bars — a blink (300 ms) vs the
//  full-stroke seek (15 ms) — the hit landing in scored silence. The goodbye
//  closes the lid: the end is the start, changed.
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const SAFE = { top: 240, bottom: 420, right: 140 };
const CX = 500;
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive';   // the storyboard header's hand font

// ---- voice helpers (injected VOICE; fallbacks keep it buildable)
function VL(id) { return (typeof VOICE !== 'undefined' && VOICE.lines.find((l) => l.id === id)) || null; }
function VW(id, word, n = 1) {
  const L = VL(id); if (!L || !L.words) return null;
  const norm = (w) => w.toLowerCase().replace(/[^a-z0-9]/g, '');
  let c = 0;
  for (const w of L.words) { if (norm(w.w) === norm(word)) { c++; if (c === n) return w; } }
  return null;
}
const t0 = (id, fb) => { const L = VL(id); return L ? L.t0 : fb; };
const t1 = (id, fb) => { const L = VL(id); return L ? L.t1 : fb; };
const at = (id, word, n, fb) => { const w = VW(id, word, n); return w ? w.t0 : fb; };

const DURATION = typeof VOICE !== 'undefined' ? VOICE.duration : 33.46;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const snap8 = (t) => Math.round(t / E8) * E8;

// ---- cues: the voice is the clock
const HIT = snap8(t1('l7', 23.96) + 0.55);           // THE PAYOFF, in the pause before l8 names it
const CUES = {
  drop: 0.05,                                          // the plinth + drive drop in (from frame 0, mid-air)
  hero: 0.5,                                           // the hero lands
  lid: at('l2', 'Inside', 1, 3.0),                     // the lid opens on the word
  spin: at('l3', 'spinning', 1, 6.5),                  // the spin-up begins
  arm: at('l4', 'arm', 1, 9.55),                       // the arm assembles
  float: at('l5', 'floats', 1, 13.55),                 // the camera pushes to the head
  gap: at('l5', 'nanometers', 1, 15.2),                // the 5 nm callout draws
  save: at('l6', 'save', 1, 17.55),                    // the file card drops
  seek1: at('l6', 'swings', 1, 19.2),                  // the arm seeks a new track
  bars: t0('l7', 21.31) - 0.2,                         // the two bars rise
  blinkW: at('l7', 'hundred', 1, 22.7),                // the blink bar fills with the word
  hit: HIT,                                            // THE HIT: the seek bar pops, the full stroke
  fifteen: at('l8', 'fifteen', 1, 27.0),               // the number locks
  crosses: at('l8', 'crosses', 1, 25.4),               // the arm crosses the disc, live
  close: t0('l9', 28.41) + 0.15,                       // the lid closes
  hop: at('l9', 'still', 1, 30.1),                     // the hero's happy hop
  settle: t1('l9', 31.46) + 0.4,                       // everything settles; the loop
};
window.CUES = CUES;

// ---- one locked-off scene, seven storyboard phases (no cuts, no morphs)
const PH = [
  ['box',     0.0,        CUES.lid,     'the sealed drive drops in; the hero lands'],
  ['inside',  CUES.lid,    CUES.spin,    'the lid opens on its hinge: the cutaway'],
  ['spin',    CUES.spin,   CUES.float,   'the spin-up; the arm and its head assemble'],
  ['float',   CUES.float,  CUES.bars,    'the camera pushes in: the head floats on air'],
  ['seek',    CUES.bars,   CUES.hit,     'a save; the seek; the two bars; the hush'],
  ['fifteen', CUES.hit,    t0('l9', 28.41) + 0.1, 'THE HIT: the full stroke; fifteen milliseconds'],
  ['close',   t0('l9', 28.41) + 0.1, DURATION, 'the lid closes; the end is the start, changed'],
];
const SHOTS = PH.map(([key, s0, s1, title], i) => [key, 0, s0, s1, title]);
const ERA_LIST = [[0, DURATION, () => sceneDrive()]];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'locked-off build',
  shots: SHOTS.map(([key, era, s0, s1, title], i) => ({ id: i + 1, key, era, t0: s0, t1: s1, title })),
  cuts: [],
  morphs: [],
  cues: CUES,
  acts: [
    { name: '1 The box',      role: 'build',   t0: 0.0,           t1: t0('l2', 3.12) },
    { name: '2 The cutaway',  role: 'build',   t0: t0('l2', 3.12), t1: CUES.spin },
    { name: '3 The spin',     role: 'peak',    t0: CUES.spin,     t1: CUES.bars },
    { name: '4 The turn',     role: 'journey', t0: CUES.bars,     t1: t1('l7', 23.96) },
    { name: '5 The hush',     role: 'silence', t0: t1('l7', 23.96), t1: CUES.hit },
    { name: '6 Fifteen',      role: 'gift',    t0: CUES.hit,      t1: t0('l9', 28.2) },
    { name: '7 The close',    role: 'goodbye', t0: t0('l9', 28.2), t1: DURATION },
  ],
  board: [
    { t: 1.6,  title: 'the sealed box', sound: 'the drop; a soft pad begins', next: 'the lid opens' },
    { t: 3.4,  title: 'the cutaway', sound: 'a hinge creak; the clockwork revealed', next: 'the spin-up' },
    { t: 6.6,  title: 'the spin-up', sound: 'the whir rises to seventy-two hundred rpm', next: 'the arm' },
    { t: 13.4, title: 'the head floats', sound: 'the push-in; the whir thins', next: 'a save' },
    { t: 19.0, title: 'the seek', sound: 'the servo sweep; the tick-tock tightens', next: 'the hush' },
    { t: 22.6, title: 'the two bars', sound: 'the music stops. true silence', next: 'THE HIT' },
    { t: 24.5, title: 'FIFTEEN MS', sound: 'THE HIT: the stab + the full stroke', next: 'the close' },
    { t: 28.6, title: 'the lid closes', sound: 'the thunk; the settle; the loop', next: 'loops' },
  ],
  narration: (typeof VOICE !== 'undefined' ? VOICE.lines : []).map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;

// the camera: locked off, one slow push to the head (z 1.045), pulled back before the payoff
function pieceCam(era, t) {
  const q = CUES;
  return push(t, q.float, q.float + 1.8, { z: 1.045, p: [615, 880], to: [615, 880] }, q.bars - 1.1, q.bars - 0.3)
    || push(t, q.close + 0.4, q.close + 1.4, { z: 1.02, p: [560, 940], to: [560, 940] }, q.settle - 0.6, DURATION)
    || null;
}
