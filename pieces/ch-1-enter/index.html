  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i < n; i++) { const a = i / n * TAU + rot; ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); }
  ctx.stroke(); ctx.restore();
}

// ---------------------------------------------------------------------
//  time (set by the renderer): TT = absolute time on the motion step (on 2s unless STYLE.ones);
//  E0 = the current era's start; DEFER = overlay queue (captions drawn after the camera); SPARK_AT = the hero's screen spot
//  ev(t, d) = 0..1 progress of an event at t over d seconds; popS(t) = back-eased pop-in scale
// ---------------------------------------------------------------------
let TT = 0, E0 = 0, DEFER = null, SPARK_AT = null;
const ev = (t, d = 0.25) => clamp((TT - t) / d);
const popS = (t) => (TT < t ? 0 : EZ.back(clamp((TT - t) / 0.25)));

// ---------------------------------------------------------------------
//  springs: closed-form, so any frame can be drawn on its own (deterministic, no state)
//  springEase(t, k, d)       0 -> 1 over time t >= 0 (stiffness k, damping d): accelerates, overshoots a hair, settles
//  springMove(t0, a, b, p)   a value moving from a to b, starting at time t0 (p = a SPRING preset)
//  springTrack(keys, p)      a value with many targets: keys = [[t, value], ...] sorted by t. One spring per change,
//                            added up, so a target change mid-move stays continuous (cursors, widths, positions)
// ---------------------------------------------------------------------
const SPRING = {
  snappy: { k: 320, d: 30 },    // UI: buttons, toggles, leading edges
  smooth: { k: 170, d: 26 },    // cards, containers, the camera
  heavy: { k: 90, d: 19 },      // big type, logos, large objects
  playful: { k: 260, d: 14 },   // mascots, stickers: visible overshoot
};
function springEase(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
const springMove = (t0, a, b, p = SPRING.smooth) => a + (b - a) * springEase(TT - t0, p.k, p.d);
function springTrack(keys, p = SPRING.smooth) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i - 1][1]) * springEase(TT - keys[i][0], p.k, p.d);
  return v;
}

// ---------------------------------------------------------------------
//  layout for several formats (9:16, 1:1, 16:9, 4:5 from one piece): place things by fractions of the frame,
//  size them by UNIT (1 at 1080 on the short side). LX(0.5), LY(0.62), 120 * UNIT. PORTRAIT / WIDE pick layouts.
// ---------------------------------------------------------------------
const LX = (f) => f * W, LY = (f) => f * H, UNIT = Math.min(W, H) / 1080, PORTRAIT = H > W * 1.2, WIDE = W > H * 1.2;

// ---------------------------------------------------------------------
//  the user's own assets (screenshots, logos): files in <piece>/assets/ that tools/build.mjs embeds in the page.
//  asset('logo.png') -> the Image (or null); drawAsset(name, x, y, w, h, { fit: 'contain'|'cover', r, alpha })
//  Real product UI only: never redraw a product screen from imagination when a screenshot exists.
// ---------------------------------------------------------------------
const asset = (name) => (typeof ASSETS !== 'undefined' && ASSETS[name] && ASSETS[name].complete ? ASSETS[name] : null);
function drawAsset(name, x, y, w, h, o = {}) {
  const img = asset(name); if (!img) return false;
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const s = (o.fit === 'cover' ? Math.max : Math.min)(w / iw, h / ih), dw = iw * s, dh = ih * s;
  ctx.save(); ctx.globalAlpha *= o.alpha ?? 1;
  if (o.r || o.fit === 'cover') { ctx.beginPath(); ctx.roundRect(x, y, w, h, o.r || 0); ctx.clip(); }
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  ctx.restore(); return true;
}
// =====================================================================
//  styles/crosshatch/kit.js — sketchy ink on warm paper. The drawing primitives live in kit/core.js
//  (ink, paint with hatch / cross / pencil / stipple textures, wobble on the boil, grain, monoText, handwrite,
//  drawPencil, irisHole, hexGrid, construct); this file adds the look's surfaces, props, hero, captions and STYLE.
//  Needs from the piece head: HAND (font stack), CX (caption centre x).
//  Shade with density functions (dens(x, y) -> 0..1), never flat fills; world-anchor textures when the camera pans.
// =====================================================================
const HANDF = HAND;
function handText(str, x, y, size, color, o = {}) {
  ctx.save();
  const R = RNG('ht', o.key ?? str, B);
  ctx.translate(x + R.n(0.7), y + R.n(0.7)); ctx.rotate((o.rot ?? 0) + R.n(0.006));
  ctx.font = `${o.weight ?? 400} ${size}px ${HANDF}`; ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
  const w = ctx.measureText(str).width, frac = clamp(o.frac ?? 1);
  if (frac <= 0) { ctx.restore(); return w; }
  if (frac < 1) { ctx.beginPath(); ctx.rect(-4, -size * 1.2, w * frac + 4, size * 1.7); ctx.clip(); }
  ctx.globalAlpha = o.al ?? 1; ctx.fillText(str, 0, 0);
  ctx.restore();
  return w;
}
function handW(str, size, weight = 400) { ctx.save(); ctx.font = `${weight} ${size}px ${HANDF}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
const box = (x, y, w, h) => resample([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], true, 30);   // dense, so trace() keeps the corners

// ---- surfaces: a full-bleed world in ink (paper, wood, cloth, the dark "inside the machine")
function paperSheet(key = 'sheet', o = {}) {   // warm paper with faint ruled lines
  paint(box(-40, -40, W + 80, H + 80), { raw: true, line: false, fill: o.fill || C.paper, key: key + 'b', tex: [{ k: 'pencil', c: '#fffaf0', al: 0.45, per: 700, a: -0.6 }] });
  if (o.ruled !== false) { ctx.save(); ctx.strokeStyle = C.paperLine; ctx.lineWidth = 1.4; ctx.beginPath(); for (let y = 260; y < H; y += 64) { ctx.moveTo(0, y); ctx.lineTo(W, y + RNG('rl', key, y).n(2)); } ctx.stroke(); ctx.restore(); }
}
function woodSurface(x0, y0, x1, y1, key, o = {}) {
  const S = RNG('woodS', key), R = RNG('woodR', key, B);
  paint(box(x0, y0, x1 - x0, y1 - y0), {
    raw: true, line: false, fill: o.fill || C.wood, key,
    tex: [{ k: 'pencil', c: C.woodL, al: 0.32, a: 0.02, len: 46, per: 900 }, { k: 'pencil', c: C.woodD, al: 0.16, a: -0.03, len: 30, per: 1400 }],
  });
  ctx.beginPath();
  for (let y = y0; y < y1; y += S.r(11, 24)) {
    const f = S.r(0.002, 0.006), ph = S.r(0, TAU), A = S.r(1, 5);
    let down = S.f() < 0.8, left = S.r(40, 420);
    for (let x = x0; x <= x1; x += 22) {
      const yy = y + Math.sin(x * f + ph) * A + R.n(0.5);
      if (down) ctx.lineTo(x, yy); else ctx.moveTo(x, yy);
      left -= 22;
      if (left <= 0) { down = !down; left = down ? S.r(60, 480) : S.r(10, 70); if (down) ctx.moveTo(x, yy); }
    }
  }
  ctx.strokeStyle = C.ink; ctx.lineWidth = o.gw ?? 1.3; ctx.globalAlpha = o.gal ?? 0.42; ctx.stroke(); ctx.globalAlpha = 1;
}
function darkWorld(key, o = {}) {   // navy, dust specks and tiny crosses: inside the computer
  fillAll(o.fill || C.navy);
  const R = RNG('dust', key), J = RNG('dustj', key, B);
  ctx.save(); screen();
  ctx.fillStyle = 'rgba(150,160,220,0.28)'; ctx.beginPath();
  for (let i = 0; i < (o.dust ?? 260); i++) ctx.rect(R.r(0, W) + J.n(0.6), R.r(0, H) + J.n(0.6), R.r(1, 2.4), R.r(1, 2.4));
  ctx.fill();
  ctx.strokeStyle = 'rgba(40,44,90,0.5)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 0; i < 70; i++) { const x = R.r(0, W), y = R.r(0, H); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y); ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); }
  ctx.stroke(); ctx.restore();
}
function stripedCloth(key, o = {}) {
  paint(box(-600, -600, 2300, 2300 + H), { raw: true, line: false, fill: o.base || C.cream, key: key + 'b', tex: [{ k: 'pencil', c: '#fffaf0', al: 0.5, per: 500, a: -0.8 }] });
  for (let k = -12; k < 12; k++) {
    const x = k * 190, P = [[x, -600], [x + 95, -600], [x + 95 + 2300, 1700 + H], [x + 2300, 1700 + H]];
    paint(P, { raw: true, line: false, fill: o.stripe || 'rgba(240,205,120,0.45)', key: key + 's' + k, tex: [{ k: 'hatch', a: Math.atan2(2300, 2300), gap: 4, c: o.hatchC || '#d9a441', al: 0.35, w: 1, dash: [30, 140] }] });
  }
}

// ---- props
function inkMug(x, y, r, key = 'mug', o = {}) {   // a mug seen from above; the coffee is a good bridge object
  paint(ellipsePts(x + 16, y + 20, r, r, 0, 40), { fill: 'rgba(92,55,28,0.25)', line: false, key: key + 'sh', tex: [{ k: 'hatch', a: 0.8, gap: 5, al: 0.4 }] });
  paint(rrectPts(x + r * 0.7, y - 20, r * 0.75, 40, 18), { fill: '#f2ede2', key: key + 'h', w: 3 });
  paint(ellipsePts(x, y, r, r, 0, 44), { fill: '#f2ede2', key: key + 'b', w: 3.2, tex: [{ k: 'pencil', c: '#d9cdb8', al: 0.6, per: 60 }, { k: 'hatch', gap: 4, a: 0.7, al: 0.3, dash: [8, 24], dens: (px, py) => clamp((px - x + py - y) / r) }] });
  ink(ellipsePts(x, y, r * 0.84, r * 0.84, 0, 40), { closed: true, w: 2, key: key + 'rim' });
  paint(ellipsePts(x, y, r * 0.78, r * 0.78, 0, 40), { fill: '#6e4128', key: key + 'c', w: 1.6, tex: [{ k: 'cross', c: '#2e170b', al: 0.35, gap: 5 }] });
  if (o.steam !== false) for (let i = 0; i < 3; i++) { const P = []; for (let k = 0; k <= 10; k++) P.push([x - 30 + i * 30 + Math.sin(k * 0.8 + TT * 3 + i) * 10, y - r - 20 - k * 14]); ink(P, { w: 2.4, color: 'rgba(58,36,23,0.45)', key: key + 'st' + i }); }
}
function toolPill(label, arg, x, y, t, o = {}) {   // a hand-painted tool-call tag: Read(notes.md). Keep them true.
  const size = o.size ?? 30, cw = monoW(size), text = label + '(' + arg + ')';
  const w = 70 + cw * text.length, h = size * 1.75, pop = EZ.back(seg(TT, t, t + 0.12));
  if (pop <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop); ctx.rotate(o.rot ?? -0.02);
  paint(rrectPts(4, 6, w, h, 14), { fill: 'rgba(58,36,23,0.35)', line: false, key: 'pillsh' + label });
  paint(rrectPts(0, 0, w, h, 14), { fill: C.paper, key: 'pill' + label, w: 3, tex: [{ k: 'pencil', c: '#e8d6b0', al: 0.6, per: 90 }] });
  ctx.beginPath(); ctx.arc(30, h / 2, 9, 0, TAU); ctx.fillStyle = o.dot || C.green; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
  monoText(label, 50, h / 2 + size * 0.36, size, C.ink, { key: 'pl' + label });
  monoText('(' + arg + ')', 50 + cw * label.length, h / 2 + size * 0.36, size, '#8a5a3a', { key: 'pa' + label, weight: 400 });
  ctx.restore();
}
function planInk(P, o = {}) {   // the plan: red pencil dashes, written on
  if ((o.frac ?? 1) <= 0) return;
  ctx.save(); ctx.setLineDash(o.dash ?? [16, 11]);
  ink(P, { closed: o.closed, color: o.c ?? 'rgba(212,56,44,0.92)', w: o.w ?? 3.4, amt: o.amt ?? 2.2, key: o.key ?? 'plan', frac: o.frac, alpha: o.al ?? 1 });
  ctx.restore();
}

// ---- the hero: a terracotta dot with a cream asterisk and a pair of eyes; works on paper and on navy
function dotHero(x, y, r, o = {}) {
  const key = o.key ?? 'hero', dark = !!o.dark;
  y += Math.sin(TT * TAU * 0.9 + key.length) * r * 0.04;                  // idle bob
  SPARK_AT = toScreen(x, y);
  if (!dark && o.shadow !== false) paint(ellipsePts(x + r * 0.55, y + r * 0.75, r * 1.08, r, 0, 28), { fill: 'rgba(58,36,23,0.3)', line: false, key: key + 'sh', tex: [{ k: 'hatch', a: 0.8, gap: 4, al: 0.6 }] });
  const P = ellipsePts(x, y, r, r, 0, 30);
  if (dark) { ink(P, { closed: true, color: 'rgba(240,150,110,0.18)', w: r * 0.7, key: key + 'g' }); ink(P, { closed: true, color: 'rgba(200,208,240,0.2)', w: 16, key: key + 'g2' }); }
  paint(P, {
    fill: C.terra, key, line: dark ? C.peri : C.ink, w: dark ? 5 : Math.max(3, r * 0.08),
    tex: [{ k: 'cross', c: C.orangeD, al: 0.5, gap: 5 }, { k: 'pencil', c: C.orangeL, al: 0.35, per: 60, dens: (px, py) => clamp((x - px + y - py) / r) }],
  });
  asterisk(x, y - r * 0.38, r * 0.06, r * 0.26, 8, o.spin ?? TT * 0.5, C.cream, Math.max(2, r * 0.06));
  const blink = (B + key.length * 7) % 41 < 2, ey = y + r * 0.08;
  for (const s of [-1, 1]) {
    if (blink) ink([[x + s * r * 0.28 - r * 0.08, ey], [x + s * r * 0.28 + r * 0.08, ey]], { w: r * 0.06, color: C.ink, key: key + 'bl' + s, amt: 0.3 });
    else { ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(x + s * r * 0.28, ey, r * 0.075, r * (o.mood === 'wow' ? 0.12 : 0.1), 0, 0, TAU); ctx.fill(); }
  }
  if (o.mood === 'happy') ink(arcPts(x, y + r * 0.3, r * 0.2, Math.PI * 0.15, Math.PI * 0.85, 10), { w: r * 0.06, color: C.ink, key: key + 'm', amt: 0.4 });
  return P;
}

// ---- captions: a paper card with an ink outline, drawn after the camera (DEFER)
function inkCard(str, x, y, size, o = {}) {
  const w = handW(str, size) + size * 0.9, h = size * 1.45, s = o.s ?? 1; if (s <= 0.01) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot ?? -0.02); ctx.scale(s, s);
  paint(rrectPts(-w / 2 + 6, -h / 2 + 8, w, h, 10), { fill: 'rgba(58,36,23,0.3)', line: false, key: 'cardsh' + str, tex: [{ k: 'hatch', a: 0.8, gap: 4, al: 0.5 }] });
  paint(rrectPts(-w / 2, -h / 2, w, h, 10), { fill: C.paper, key: 'card' + str, w: 3, tex: [{ k: 'pencil', c: '#e8d6b0', al: 0.5, per: 90 }] });
  handText(str, -w / 2 + size * 0.45, size * 0.36, size, o.color ?? C.ink, { key: 'cardt' + str, frac: o.frac });
  ctx.restore();
}
const inkTag = (str) => { const f = () => inkCard(str, 70 + (handW(str, 80) + 72) / 2, 330, 80, { rot: -0.04, s: popS(E0 + 0.2) }); if (DEFER) DEFER.push(f); else f(); };
const inkCaption = (str) => { const f = () => inkCard(str, CX, 1440, 50, { rot: 0.012, frac: ev(E0 + 0.45, 0.6) }); if (DEFER) DEFER.push(f); else f(); };

// =====================================================================
//  STYLE — the renderer's hooks (see styles/cut-paper/kit.js for the contract)
// =====================================================================
const STYLE = {
  name: 'crosshatch',
  paper: C.paper,
  backdrop(c) { paint(box(-40, -40, W + 80, H + 80), { raw: true, line: false, fill: c, key: 'backdrop', tex: [{ k: 'pencil', c: '#fffaf0', al: 0.35, per: 700, a: -0.6 }] }); },
  window(P, key, src) {   // the world seen through an inked hole with a hatched shadow
    const Q = wobble(P, true, 2.5, key, 9);
    ctx.save(); ctx.translate(10, 14); trace(Q, true); ctx.clip(); hatch(bbox(Q, 20), { key: key + 'sh', a: 0.8, gap: 5, al: 0.45 }); ctx.restore();
    ctx.save(); trace(Q, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    ink(P, { closed: true, w: 4.5, key: key + 'rim', double: true });
  },
  blob(P, c, key) { paint(P, { fill: c, key, w: 4, tex: [{ k: 'hatch', a: 0.8, gap: 6, al: 0.35 }, { k: 'pencil', c: '#fff6e0', al: 0.3, per: 80 }] }); },
  hero(x, y, r, o) { dotHero(x, y, r * 0.6, { ...o, key: o.key }); },
  heroColor: C.terra,
  heroPts: (x, y, r) => ellipsePts(x, y, r * 0.6, r * 0.6, 0, 96),
  post() { grain({ n: 2600 }); },
};

// =====================================================================
//  SCENES — ch-1-enter. World coords 1080x1920, time TT on 2s.
//  F5: the dot (the command) holds ~(540, 880) through every station;
//  day = warm paper userland, night = navy inside the machine.
//  The red dashed plan (the pipeline) draws first; the journey follows it.
// =====================================================================
const HX = 540, HY = 880;    // the hero's home through the whole ride
const dot2 = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); };

// a terminal window drawn as an inked card (the day-world object)
function termCard(x, y, w, h, key, o = {}) {
  paint(rrectPts(x, y, w, h, 16), { fill: C.paper, key: key + 'b', w: 3.5, tex: [{ k: 'pencil', c: '#e8d6b0', al: 0.55, per: 90 }] });
  ink([[x + 14, y + 58], [x + w - 14, y + 58]], { w: 2.6, key: key + 'bar' });
  inkText3('$', x + 26, y + 112, key);
}
// small inked monospace line helper (dark, on paper)
function inkText3(s, x, y, key) { monoText(s, x, y, 44, C.ink, { key: key + 't' }); }

// a keycap that presses (used for l and s and Enter)
function keycap(x, y, s, label, key, press) {
  const dy = 8 * press;
  paint(rrectPts(x, y + dy, 120 * s, 110 * s, 12), { fill: press > 0.5 ? C.cream : '#faf3e2', key: key + 'b', w: 3.4, tex: [{ k: 'hatch', a: 0.7, gap: 6, al: 0.16, dens: (px, py) => clamp((px - x + py - y) / (200 * s)) }] });
  monoText(label, x + 60 * s, y + dy + 70 * s, 44 * s, C.ink, { key: key + 'l' });
}
// the laptop: base + screen (a small dark island on the paper world)
function laptop(x, y, s, key, screenLines, typeFrac, o = {}) {
  paint(rrectPts(x - 420 * s, y - 300 * s, 840 * s, 560 * s, 14), { fill: C.paper, key: key + 'fr', w: 4, tex: [{ k: 'pencil', c: '#e8d6b0', al: 0.5, per: 110 }] });
  paint(rrectPts(x - 390 * s, y - 270 * s, 780 * s, 440 * s, 8), { fill: C.navy2, key: key + 'sc', w: 3, line: C.ink, tex: [{ k: 'cross', c: C.navy, al: 0.5, gap: 8 }] });
  monoText('$', x - 350 * s, y - 190 * s, 46 * s, C.cyan, { key: key + 'p' });
  screenLines.forEach((sl, i) => monoText(sl, x - 290 * s, y - 190 * s + i * 74 * s, 42 * s, i % 2 ? '#9fe8dc' : C.cream, { key: key + 'l' + i, count: Math.floor(clamp((typeFrac - i * 0.18) / 0.5) * sl.length) }));
  paint(rrectPts(x - 460 * s, y + 260 * s, 920 * s, 60 * s, 10), { fill: C.wood, key: key + 'bs', w: 3.4, tex: [{ k: 'pencil', c: C.woodL, al: 0.3, per: 70, a: 0.02 }] });
  if (o.cursor !== false && ((B % 6) < 3)) ink([[x - 290 * s + monoW(42 * s) * (screenLines[0].length + 1), y - 190 * s - 34], [x - 290 * s + monoW(42 * s) * (screenLines[0].length + 1), y - 190 * s + 14]], { w: 8, color: C.cyan, key: key + 'cur' });
}

// =====================================================================
//  STATION 1 — the desk: you type two letters and press Enter
// =====================================================================
function sDesk() {
  const cu = TIMELINE.cues;
  woodSurface(-40, -40, W + 40, H + 40, 'desk1', {});
  // the red plan: the whole journey, dashed, drawn as the line is spoken
  planInk([[150, 260], [930, 260]], { key: 'planTop', frac: ev(cu.plan - 0.6, 0.6) });
  planInk([[540, 260], [540, 700]], { key: 'planDn', frac: ev(cu.plan - 0.3, 0.5) });
  // the laptop with the line being typed
  const typed = clamp((TT - cu.keyL) / 0.5) + clamp((TT - cu.keyS) / 0.5);
  laptop(540, 760, 1.0, 'lp1', ['ls'], clamp((TT - cu.keyL) / 0.6), { cursor: TT < cu.enter });
  // the two keycaps pressing on their words (l, s), Enter big at the right
  keycap(240, 1300, 1.0, 'l', 'kl', seg(TT, cu.keyL, cu.keyL + 0.12));
  keycap(420, 1300, 1.0, 's', 'ks', seg(TT, cu.keyS, cu.keyS + 0.12));
  keycap(660, 1290, 1.15, 'enter', 'ke', seg(TT, cu.enter, cu.enter + 0.14));
  ink([[660, 1272], [660 + 138, 1272]], { w: 3, color: 'rgba(212,56,44,0.9)', amt: 1.5, key: 'entar', frac: ev(cu.enter, 0.3) });   // the arrow on the enter cap
  // the dot launches from the screen on Enter
  const lk = popS(cu.launch);
  if (lk > 0) dotHero(HX, lerp(700, HY, lk), 110 * (0.7 + 0.3 * lk), { key: 'hero', mood: TT < cu.enter ? 'focus' : 'wow' });
  else dotHero(HX, 700, 78, { key: 'hero', mood: 'focus' });

  inkMug(180, 560, 100, 'mug1');

// =====================================================================
//  ERAS + BRIDGES — ch-1-enter. Two hero-to-hero bridges: the dot falls
//  INTO the machine (B1) and climbs back OUT (B2); every other station
//  change is a hard cut on the 8th grid (F5 beat-cut). The dot keeps its
//  terracotta + asterisk in both worlds (it glows in the dark).
// =====================================================================
const ERA_BG = [C.paper, C.paper, C.paper, C.paper, C.navy, C.navyD, C.navy, C.paper, C.paper, C.paper];

const BRIDGES = [
  { // B1: down into the machine — the paper world closes onto the dot,
    // it drops through the inked hole, and the kernel's navy opens around it
    tc: B1, d: 0.4,
    A: () => SP(540, 976, 183),
    B: () => SP(540, 1040, 183),
  },
  { // B2: back out — the dark closes onto the dot (now carrying the bytes),
    // it climbs through the hole, and the desk's paper world opens
    tc: B2, d: 0.4,
    A: () => SP(540, 880, 183),
    B: () => SP(540, 300, 183),
  },
];

// =====================================================================
//  kit/morph.js — the renderer for pieces built from ERAS (scenes) joined by SHAPE MORPHS.
//
//  At each bridge time tc:
//    shrink [tc-d, tc-m]      the old era is seen through a window shaped like the bridge object (STYLE.window),
//                             shrinking onto the object while the backdrop fades to blank paper
//    morph  [tc-m, tc+m]      on blank paper, the object's outline blends into its counterpart's
//                             (both resampled by angle around their centroids; colour lerped). Hero-to-hero
//                             bridges draw the hero itself with blended position, size and ray count.
//    grow   [tc+m, tc+d]      the new era opens out of a window shaped like the counterpart
//    d = the bridge's half-length (default 0.6s, so a bridge costs 1.2s), m = the morph's half (default 0.2s, or d/3 when d is set).
//    Short pieces: { tc, d: 0.4 } (0.8s) or fewer bridges — see craft.md -> Transitions.
//  Era boundaries WITHOUT a bridge are hard cuts (keep at most one: the slam).
//
//  The piece defines (in its head / src):
//    ERA_LIST = [[t0, t1, () => drawScene()], ...]      scenes draw in world coords, call yearTag()/capStrip()
//    ERA_BG   = ['#hex', ...]                          each era's dominant colour (for the fade to paper)
//    BRIDGES  = [{ tc, A: () => shape, B: () => shape, d?, m? }]   shape = { P: points, c: '#hex' } or SP(x, y, r, rays)
//    function pieceCam(era, t) { return null | CAM }   optional; use push() / bump() below
//  Shapes are in each era's world coords; the bridge object must be in frame at tc (pull push-ins back first).
//  The look comes from the style kit's STYLE hooks (paper, backdrop, window, blob, hero, post, ones):
//  this file draws nothing itself, so the same piece structure works in any style.
// =====================================================================
// ---- cameras: CAM = { z, tx, ty }; camOf({ z, p, to }) puts world point p on screen point to
const CAM0 = { z: 1, tx: 0, ty: 0 };
const camOf = (c) => ({ z: c.z, tx: c.to[0] - c.z * c.p[0], ty: c.to[1] - c.z * c.p[1] });

  pad(B1, K5, ['A2', 'D3'], 0.02, { type: 'triangle', cut: 500, att: 0.5, rel: 0.2 });

  pad(B2, 25.2, ['D3', 'A3', 'G4'], 0.034, { cut: 1000, att: 0.3, rel: 0.05, send: 0.25 });
  each(B2 + 0.3, 24.4, E8, (t, k) => { if (k % 2 === 0) pluck(t, nz(['D4', 'G4', 'A4', 'B4'][k % 4]), 0.038 * (t > 24.0 ? 0.5 : 1), Math.sin(k) * 0.3, 0.26, 3000, t > 24.0 ? 0.05 : 0.15); });

  // THE HIT at cu.hit: the stopwatch — the single loudest moment
  ['D3', 'A3', 'D4', 'Fs4', 'A4'].forEach((n, i) => pluck(cu.hit + i * 0.006, nz(n), 0.42, (i - 2) * 0.15, 0.7, 5200, 0.4));
  pad(cu.hit, cu.hit + 0.35, ['D3', 'A3', 'D4', 'Fs4', 'A4'], 0.52, { cut: 3600, att: 0.008, rel: 0.3, send: 0.3 });

  dotMotif(K7 + 1.0, 0.09);

  // ================= SFX =================
  to = 's';
  // the typing: l, s — clacks; Enter is a deeper clack + a sub

  noiseHit(cu.keyS, 0.02, 'bandpass', 3100 + R.n(400), 2.4, 0.09);
  noiseHit(cu.enter, 0.03, 'bandpass', 1900, 1.6, 0.14); sub(cu.enter + 0.01, 0.18);
  blip(cu.launch, 500, 1100, 0.1, 0.1); chime(cu.launch + 0.02, [nz('D6')], 0.05);
  // the parse: the split scratch; the box pop
  for (let t = cu.split; t < cu.split + 0.3; t += E16) noiseHit(t, 0.06, 'bandpass', 2800 + R.n(400), 1.4, 0.022, 0.2);
  noiseHit(cu.words + 0.05, 0.04, 'lowpass', 1400, 0.8, 0.07);
  // fork: two low blips (parent, child)
  blip(cu.twin, 320, 260, 0.12, 0.07, -0.2); blip(cu.twin + 0.18, 380, 300, 0.1, 0.06, 0.2);

  for (let t = cu.code; t < cu.code + 0.8; t += E16) if (R.f() < 0.8) noiseHit(t + 0.005, 0.015, 'bandpass', 4200 + R.n(600), 3, 0.032, R.n(0.4));
  noiseHit(cu.exec, 0.05, 'lowpass', 900, 0.8, 0.1); blip(cu.exec, 700, 1200, 0.08, 0.05);

  sweep(B1 - 0.25, B1 + 0.1, 0.014, 2200, 300, 0);
  sweep(B2 - 0.25, B2 + 0.1, 0.014, 300, 2200, 0);
  // inside: the machine hums (band noise, low)
  { const src = ac.createBufferSource(); src.buffer = noise; src.loop = true; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 320;
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, B1); g.gain.exponentialRampToValueAtTime(0.009, B1 + 0.6); g.gain.setValueAtTime(0.009, K5 - 0.3); g.gain.exponentialRampToValueAtTime(0.0001, K5);

  chime(cu.ask + 0.15, [nz('A4'), nz('D5')], 0.045);
  // the disk: platter ticks on 8ths, the head seeks (a short riser)
  for (let t = K4 + 0.2; t < K5 - 0.2; t += E8) noiseHit(t, 0.02, 'bandpass', 2600, 2.2, 0.035, 0.3);
  sweep(cu.head, cu.head + 0.35, 0.012, 1800, 3200, 0);
  blip(cu.disk, 900, 600, 0.09, 0.05); // the disk answers
  // the rush: bytes ticking up, accelerating into the bridge
  for (let i = 0; i < 14; i++) noiseHit(cu.back + i * E16, 0.02, 'bandpass', 2000 + i * 260, 2.6, 0.03, R.n(0.5));
  // the write: fast typing as the answer lands
  for (let t = B2 + 0.4; t < 25.0; t += E16) if (R.f() < 0.75) noiseHit(t + 0.005, 0.016, 'bandpass', 3600 + R.n(600), 3, 0.026, R.n(0.4));
  // THE HIT: the stopwatch snap
  sub(cu.hit, 0.5); noiseHit(cu.hit, 0.012, 'highpass', 6000, 0.8, 0.26); noiseHit(cu.hit, 0.26, 'lowpass', 900, 0.7, 0.3, 0, 0.4);
  chime(cu.hit + 0.02, [nz('D5'), nz('Fs5'), nz('A5'), nz('D6')], 0.1);
  noiseHit(cu.watch + 0.35, 0.05, 'bandpass', 1500, 1.2, 0.05); // the readout writes
  // the cursor: soft blink blips on the blink beats
  [K7 + 0.9, K7 + 1.4, K7 + 1.9, K7 + 2.4].forEach((t, i) => blip(t, 800, 1100, 0.04, 0.02, i % 2 ? 0.2 : -0.2));
  // the final Enter hint: one soft clack under "again"
  noiseHit(cu.again - 0.1, 0.02, 'bandpass', 1900, 1.6, 0.08);
  // =====================================================================
  //  kit/score-tail.js — render, fold the tail over the loop point, loudness stage
  //  (RMS-normalise to -17 dBFS, look-ahead limiter at -1 dBFS; stems share the mix gain curve)
  // =====================================================================
  const buf = await ac.startRendering();

  // loudness for a phone (subagents-short): RMS-normalise to -17 dBFS, then a look-ahead limiter at -1 dBFS.
  // Stems reuse the mix's gain and gain curve, so they sum back to the mix.
  let k = normIn?.k, g = normIn?.g;

    k = 10 ** (-17 / 20) / Math.sqrt(sum / N || 1e-12);

async function renderAudioWav() { return wavB64(await buildScore(48000, 'mix')); }
async function renderAudioStems() {

  const music = await buildScore(48000, 'music', mix.norm), sfx = await buildScore(48000, 'sfx', mix.norm);

window.renderAudioStems = renderAudioStems;
